name: Import FITMEAL INDIA source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: ${{ contains(github.event.head_commit.message, 'Bootstrap full FITMEAL INDIA') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract the project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fitmeal-source
          cat bootstrap-parts/01.b64 bootstrap-parts/02.b64 bootstrap-parts/03.b64 bootstrap-parts/04.b64 bootstrap-parts/05.b64 bootstrap-parts/06.b64 | tr -d '\n' | base64 --decode > /tmp/fitmealindia-source.tar.xz
          tar -xJf /tmp/fitmealindia-source.tar.xz -C /tmp/fitmeal-source
          cp -a /tmp/fitmeal-source/. .
          rm -rf bootstrap-parts
          rm -f .github/workflows/bootstrap-import.yml
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -v
          find app routes public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit the complete project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete FITMEAL INDIA PHP and MySQL MVP"
          git push origin HEAD:main
